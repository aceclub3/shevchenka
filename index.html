<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no">
<title>Проєкт Шевченка — візуалізації та креслення</title>
<meta name="description" content="Дизайн-проєкт: візуалізації інтер'єру 1-го та 2-го поверхів, повний комплект креслень і PDF для завантаження.">
<meta property="og:type" content="website">
<meta property="og:title" content="Проєкт Шевченка">
<meta property="og:description" content="Візуалізації інтер'єру (1-й та 2-й поверхи) та креслення. PDF доступний для завантаження.">
<meta property="og:image" content="https://aceclub3.github.io/shevchenka/og.jpg">
<meta property="og:url" content="https://aceclub3.github.io/shevchenka/">
<meta property="og:locale" content="uk_UA">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#111110">
<link rel="canonical" href="https://aceclub3.github.io/shevchenka/">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏠</text></svg>">
<style>
:root{
  --bg:#111110; --bg2:#1a1917; --card:#1e1d1a;
  --text:#f0ede6; --muted:#a39d90; --accent:#c9a273; --line:#2c2a26;
}
*{margin:0;padding:0;box-sizing:border-box}
/* pan-x pan-y — гортати можна, масштабувати сторінку ні: інакше випадковий
   жест по мініатюрі збільшує весь сайт і повернути назад майже неможливо.
   Самі зображення масштабуються всередині перегляду власним зумом. */
html{scroll-behavior:smooth;touch-action:pan-x pan-y}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased}
img{display:block;max-width:100%}
a{color:inherit}

/* ── Шапка ── */
.topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:8px;padding:10px 14px;background:rgba(17,17,16,.82);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.topbar .brand{font-weight:700;letter-spacing:.02em;white-space:nowrap;font-size:15px}
.topbar .links{flex:1;min-width:0;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.topbar .links::-webkit-scrollbar{display:none}
.topbar a.nav{white-space:nowrap;text-decoration:none;font-size:13.5px;color:var(--muted);padding:6px 11px;border-radius:99px;transition:.15s}
.topbar a.nav:hover{color:var(--text);background:var(--bg2)}
.topbar a.pdfbtn{flex:none;white-space:nowrap;text-decoration:none;font-size:13px;font-weight:600;color:#161511;background:var(--accent);padding:7px 13px;border-radius:99px}
@media(max-width:560px){.topbar .brand{display:none}.topbar a.nav{padding:6px 9px}}

/* ── Hero ── */
.hero{position:relative;height:min(72vh,640px);min-height:340px;overflow:hidden}
.hero img{width:100%;height:100%;object-fit:cover;filter:brightness(.92)}
.hero .shade{position:absolute;inset:0;background:linear-gradient(to top,var(--bg) 0%,rgba(17,17,16,.86) 22%,rgba(17,17,16,.3) 55%,rgba(17,17,16,.15) 100%)}
.hero .inner{position:absolute;left:0;right:0;bottom:0;padding:28px 20px 34px;max-width:1200px;margin:0 auto}
.hero h1{font-size:clamp(30px,6vw,54px);font-weight:800;letter-spacing:-.01em;line-height:1.1}
.hero p{color:#d8d3c8;margin-top:10px;font-size:clamp(14px,2.2vw,17px);max-width:640px}
.hero .stats{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.hero .chip{font-size:12.5px;color:var(--text);background:rgba(30,29,26,.75);border:1px solid var(--line);padding:5px 12px;border-radius:99px;backdrop-filter:blur(6px)}

/* ── Секції ── */
main{max-width:1200px;margin:0 auto;padding:10px 14px 40px}
section{padding-top:34px;scroll-margin-top:52px}
.sechead{display:flex;align-items:baseline;gap:12px;margin-bottom:16px}
.sechead h2{font-size:clamp(20px,3.4vw,28px);font-weight:700;letter-spacing:-.01em}
.sechead .count{color:var(--muted);font-size:14px}
.grid{columns:2 320px;column-gap:10px}
@media(max-width:520px){.grid{columns:1}}
@media(min-width:1100px){.grid{columns:3 300px}}
/* креслення — однакові пропорції, тому звичайна сітка зліва направо */
.grid.rows{columns:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,290px),1fr));gap:10px}
.grid.rows a.ph{margin-bottom:0}
.grid a.ph{display:block;margin-bottom:10px;break-inside:avoid;border-radius:10px;overflow:hidden;background:var(--card);position:relative}
.grid a.ph img{width:100%;height:auto;transition:transform .25s ease,opacity .3s;opacity:0}
.grid a.ph img.ld{opacity:1}
@media(hover:hover){.grid a.ph:hover img{transform:scale(1.025)}}
.grid a.ph .tag{position:absolute;left:8px;bottom:8px;font-size:11.5px;background:rgba(17,17,16,.72);padding:3px 9px;border-radius:99px;color:#e8e4da;backdrop-filter:blur(4px)}

/* ── Блок PDF ── */
.pdfcard{display:flex;flex-wrap:wrap;align-items:center;gap:14px;background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:18px}
.pdfcard .ico{font-size:30px}
.pdfcard .t{flex:1;min-width:180px}
.pdfcard .t b{font-size:15.5px}
.pdfcard .t div{color:var(--muted);font-size:13px;margin-top:2px}
.pdfcard a.dl{text-decoration:none;font-weight:600;font-size:14px;color:#161511;background:var(--accent);padding:10px 18px;border-radius:10px;white-space:nowrap}

footer{border-top:1px solid var(--line);color:var(--muted);font-size:13px;text-align:center;padding:22px 14px 30px}

/* ── Лайтбокс ── */
/* touch-action:none — жести зуму й панорамування обробляє сам скрипт, а не браузер */
.lb{position:fixed;inset:0;z-index:100;background:rgba(8,8,7,.97);display:none;touch-action:none}
.lb.open{display:block}
.lb .stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
.lb .stage img{max-width:100vw;max-height:100dvh;object-fit:contain;user-select:none;-webkit-user-drag:none;transform-origin:50% 50%}
.lb.zoomed .stage img{cursor:grab}
.lb.zoomed .stage img:active{cursor:grabbing}
.lb .zoomchip{display:none;flex:none;font-size:13px;color:#ddd8cd;background:rgba(40,38,34,.8);padding:7px 12px;border-radius:99px;white-space:nowrap;cursor:pointer}
.lb.zoomed .zoomchip{display:block}
.lb .bar{position:absolute;top:0;left:0;right:0;display:flex;flex-wrap:nowrap;align-items:center;gap:10px;padding:12px 14px;background:linear-gradient(rgba(8,8,7,.8),transparent);z-index:2}
/* підписи — «пігулками», бо під ними може бути біле креслення */
.lb .cap{font-size:13px;color:#ddd8cd;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;background:rgba(40,38,34,.8);padding:7px 12px;border-radius:99px}
.lb .cnt{font-size:13px;color:#ddd8cd;white-space:nowrap;flex:none;background:rgba(40,38,34,.8);padding:7px 12px;border-radius:99px}
.lb .full{margin-left:auto;flex:none;font-size:13px;color:#ddd8cd;text-decoration:none;background:rgba(40,38,34,.8);padding:7px 12px;border-radius:99px;white-space:nowrap}
@media(max-width:560px){.lb .cap{display:none}.lb .full .fl{display:none}.lb .full{padding:7px 11px;font-size:15px}}
.lb button{appearance:none;border:0;cursor:pointer;background:rgba(40,38,34,.8);color:#eee;border-radius:99px;display:flex;align-items:center;justify-content:center}
.lb .x{width:38px;height:38px;font-size:17px}
.lb .nav{position:absolute;top:50%;transform:translateY(-50%);width:46px;height:64px;font-size:24px;z-index:2}
.lb .prev{left:8px}.lb .next{right:8px}
@media(max-width:640px){.lb .nav{width:38px;height:52px;font-size:20px}}
.lb .spin{position:absolute;width:34px;height:34px;border:3px solid #3a382f;border-top-color:var(--accent);border-radius:50%;animation:sp 1s linear infinite;display:none}
.lb.loading .spin{display:block}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<nav class="topbar">
  <span class="brand">Проєкт Шевченка</span>
  <div class="links">
    <a class="nav" href="#f1">1-й поверх</a>
    <a class="nav" href="#f2">2-й поверх</a>
    <a class="nav" href="#dwg">Креслення</a>
  </div>
  <a class="pdfbtn" href="files/kreslennya.pdf" download="Креслення — проєкт Шевченка.pdf">PDF ↓</a>
</nav>

<header class="hero">
  <img id="heroImg" alt="Візуалізація інтер'єру">
  <div class="shade"></div>
  <div class="inner">
    <h1>Проєкт Шевченка</h1>
    <p>Дизайн-проєкт інтер'єру: повні візуалізації першого та другого поверхів і робочі креслення.</p>
    <div class="stats" id="heroStats"></div>
  </div>
</header>

<main id="app"></main>

<footer>Проєкт Шевченка · матеріали дизайн-проєкту · оновлено серпень 2026</footer>

<div class="lb" id="lb" aria-modal="true" role="dialog">
  <div class="stage"><div class="spin"></div><img id="lbImg" alt=""></div>
  <div class="bar">
    <button class="x" id="lbClose" aria-label="Закрити">✕</button>
    <span class="cap" id="lbCap"></span>
    <span class="cnt" id="lbCnt"></span>
    <button class="zoomchip" id="lbZoom" title="Скинути масштаб">100%</button>
    <a class="full" id="lbFull" target="_blank" rel="noopener"><span class="fl">Повний розмір </span>↗</a>
  </div>
  <button class="nav prev" id="lbPrev" aria-label="Попереднє">‹</button>
  <button class="nav next" id="lbNext" aria-label="Наступне">›</button>
</div>

<noscript><p style="padding:20px;text-align:center">Для перегляду галереї увімкніть JavaScript. Креслення: <a href="files/kreslennya.pdf">завантажити PDF</a>.</p></noscript>

<script src="data.js"></script>
<script>
(function(){
  // Safari на iPhone ігнорує user-scalable=no, тож його власні жести масштабування
  // сторінки гасимо вручну. Зум зображень це не зачіпає — він свій, у перегляді.
  ['gesturestart', 'gesturechange', 'gestureend'].forEach(function(t){
    document.addEventListener(t, function(e){ e.preventDefault(); }, { passive: false });
  });

  var D = window.GALLERY_DATA;
  var app = document.getElementById('app');
  var flat = []; // глобальний список для лайтбокса

  // hero
  document.getElementById('heroImg').src = D.hero.src;
  var st = document.getElementById('heroStats');
  D.sections.forEach(function(s){
    var c = document.createElement('span');
    c.className = 'chip';
    c.textContent = s.title.replace('Візуалізації — ','') + ' · ' + s.items.length + (s.key==='dwg' ? ' арк.' : ' фото');
    st.appendChild(c);
  });

  // секції
  D.sections.forEach(function(s){
    var sec = document.createElement('section');
    sec.id = s.key;
    var head = document.createElement('div');
    head.className = 'sechead';
    head.innerHTML = '<h2>' + s.title + '</h2><span class="count">' + s.items.length + (s.key==='dwg' ? ' аркушів' : ' фото') + '</span>';
    sec.appendChild(head);

    if (s.key === 'dwg') {
      var pc = document.createElement('div');
      pc.className = 'pdfcard';
      pc.innerHTML = '<span class="ico">📐</span><div class="t"><b>Креслення.pdf</b><div>Повний комплект робочих креслень · ' + D.pdf.mb + ' МБ · ' + s.items.length + ' аркушів</div></div>' +
        '<a class="dl" href="' + D.pdf.href + '" download="Креслення — проєкт Шевченка.pdf">Завантажити PDF</a>';
      sec.appendChild(pc);
    }

    var grid = document.createElement('div');
    grid.className = 'grid' + (s.key === 'dwg' ? ' rows' : '');
    s.items.forEach(function(it, i){
      var gi = flat.length;
      flat.push({ src: it.src, cap: s.title, tag: (s.key==='dwg' ? 'Аркуш ' + (i+1) : (i+1) + ' / ' + s.items.length) });
      var a = document.createElement('a');
      a.className = 'ph';
      a.href = it.src;
      var im = document.createElement('img');
      im.loading = 'lazy';
      im.decoding = 'async';
      im.src = it.thumb;
      im.width = it.w; im.height = it.h;
      im.alt = s.title + ', зображення ' + (i+1);
      im.onload = function(){ im.classList.add('ld'); };
      if (im.complete) im.classList.add('ld');
      a.appendChild(im);
      if (s.key === 'dwg') {
        var t = document.createElement('span');
        t.className = 'tag';
        t.textContent = 'Аркуш ' + (i+1);
        a.appendChild(t);
      }
      a.addEventListener('click', function(e){ e.preventDefault(); open(gi); });
      grid.appendChild(a);
    });
    sec.appendChild(grid);
    app.appendChild(sec);
  });

  // ── лайтбокс ──
  var lb = document.getElementById('lb'), lbImg = document.getElementById('lbImg'),
      lbCap = document.getElementById('lbCap'), lbCnt = document.getElementById('lbCnt'),
      lbFull = document.getElementById('lbFull');
  var cur = -1, isOpen = false;

  function show(i){
    cur = (i + flat.length) % flat.length;
    var it = flat[cur];
    resetZoom(false);
    lb.classList.add('loading');
    lbImg.src = it.src;
    lbImg.onload = function(){ lb.classList.remove('loading'); };
    lbCap.textContent = it.cap;
    lbCnt.textContent = it.tag;
    lbFull.href = it.src;
    // передзавантаження сусідів
    [cur+1, cur-1].forEach(function(n){
      var p = new Image(); p.src = flat[(n + flat.length) % flat.length].src;
    });
  }
  function open(i){
    show(i);
    lb.classList.add('open');
    document.body.style.overflow = 'hidden';
    if (!isOpen) { history.pushState({lb:1}, ''); isOpen = true; }
  }
  function close(fromPop){
    lb.classList.remove('open');
    document.body.style.overflow = '';
    lbImg.src = '';
    if (isOpen && !fromPop) history.back();
    isOpen = false;
  }
  window.addEventListener('popstate', function(){ if (isOpen) close(true); });
  document.getElementById('lbClose').addEventListener('click', function(){ close(false); });
  document.getElementById('lbPrev').addEventListener('click', function(){ show(cur-1); });
  document.getElementById('lbNext').addEventListener('click', function(){ show(cur+1); });
  lb.addEventListener('click', function(e){ if (e.target === lb || e.target.classList.contains('stage')) close(false); });
  document.addEventListener('keydown', function(e){
    if (!isOpen) return;
    if (e.key === 'Escape') close(false);
    else if (e.key === 'ArrowLeft') show(cur-1);
    else if (e.key === 'ArrowRight') show(cur+1);
  });
  // ── Зум і панорамування ──
  // Жести обробляє скрипт, а не браузер: два пальці масштабують, один палець
  // по збільшеному кресленню рухає його, а гортання працює лише при 100%.
  var stage = lb.querySelector('.stage'), zoomBtn = document.getElementById('lbZoom');
  var MAXZ = 6;
  var sc = 1, ox = 0, oy = 0;

  function applyTf(anim){
    lbImg.style.transition = anim ? 'transform .18s ease-out' : 'none';
    lbImg.style.transform = 'translate(' + ox + 'px,' + oy + 'px) scale(' + sc + ')';
    lb.classList.toggle('zoomed', sc > 1.01);
    zoomBtn.textContent = Math.round(sc * 100) + '%';
  }
  function clampPan(){
    var mx = Math.max(0, (lbImg.offsetWidth * sc - stage.clientWidth) / 2);
    var my = Math.max(0, (lbImg.offsetHeight * sc - stage.clientHeight) / 2);
    ox = Math.min(mx, Math.max(-mx, ox));
    oy = Math.min(my, Math.max(-my, oy));
  }
  function resetZoom(anim){ sc = 1; ox = 0; oy = 0; clampPan(); applyTf(!!anim); }
  function centerOf(){ var r = stage.getBoundingClientRect(); return { x: r.left + r.width / 2, y: r.top + r.height / 2 }; }
  // Масштабує до ns так, щоб точка екрана (px,py) лишалась під пальцем/курсором.
  function zoomTo(ns, px, py, anim){
    ns = Math.min(MAXZ, Math.max(1, ns));
    var c = centerOf();
    ox = (px - c.x) - (ns / sc) * ((px - c.x) - ox);
    oy = (py - c.y) - (ns / sc) * ((py - c.y) - oy);
    sc = ns;
    if (sc <= 1.01) { ox = 0; oy = 0; sc = 1; }
    clampPan();
    applyTf(!!anim);
  }
  zoomBtn.addEventListener('click', function(){ resetZoom(true); });
  window.addEventListener('resize', function(){ if (isOpen) { clampPan(); applyTf(false); } });

  // ── дотик ──
  var gesture = null, pinch = null, pan = null, swipe = null, lastTap = 0, lastTapX = 0, lastTouchEnd = 0;
  function pts(e){ var o = []; for (var i = 0; i < e.touches.length; i++) o.push({ x: e.touches[i].clientX, y: e.touches[i].clientY }); return o; }
  function gap(a, b){ return Math.sqrt((a.x - b.x) * (a.x - b.x) + (a.y - b.y) * (a.y - b.y)); }

  // pan — точка дотику одним пальцем, swipe — той самий дотик, але лише при 100%,
  // бо гортати можна тільки незбільшене зображення.
  function startOne(p, ts){
    gesture = 'one';
    pan = { x: p.x, y: p.y, ox: ox, oy: oy, t: ts };
    swipe = sc <= 1.01 ? { x: p.x, y: p.y } : null;
  }
  function startPinch(t){
    gesture = 'pinch';
    swipe = null;
    pinch = { d: gap(t[0], t[1]), s: sc, mx: (t[0].x + t[1].x) / 2, my: (t[0].y + t[1].y) / 2, ox: ox, oy: oy };
  }

  lb.addEventListener('touchstart', function(e){
    var t = pts(e);
    if (t.length === 1) startOne(t[0], e.timeStamp);
    else if (t.length >= 2) startPinch(t);
  }, { passive: true });

  lb.addEventListener('touchmove', function(e){
    var t = pts(e);
    if (gesture === 'pinch' && t.length >= 2 && pinch && pinch.d > 0) {
      var ns = Math.min(MAXZ, Math.max(1, pinch.s * gap(t[0], t[1]) / pinch.d));
      var c = centerOf(), mx = (t[0].x + t[1].x) / 2, my = (t[0].y + t[1].y) / 2;
      ox = (mx - c.x) - (ns / pinch.s) * ((pinch.mx - c.x) - pinch.ox);
      oy = (my - c.y) - (ns / pinch.s) * ((pinch.my - c.y) - pinch.oy);
      sc = ns;
      clampPan(); applyTf(false);
    } else if (gesture === 'one' && t.length === 1 && pan && sc > 1.01) {
      ox = pan.ox + (t[0].x - pan.x);
      oy = pan.oy + (t[0].y - pan.y);
      swipe = null;
      clampPan(); applyTf(false);
    }
  }, { passive: true });

  lb.addEventListener('touchend', function(e){
    // палець(і) ще на екрані — переналаштовуємо жест на ту кількість, що лишилась
    if (e.touches.length) {
      var t = pts(e);
      if (t.length >= 2) startPinch(t); else { startOne(t[0], e.timeStamp); swipe = null; }
      return;
    }
    var c = e.changedTouches[0];
    if (gesture === 'pinch' && sc <= 1.01) resetZoom(true);
    if (gesture === 'one' && pan) {
      var dx = c.clientX - pan.x, dy = c.clientY - pan.y, dt = e.timeStamp - pan.t;
      if (Math.abs(dx) < 12 && Math.abs(dy) < 12 && dt < 400) {
        // подвійний тап по зображенню — наблизити / повернути 100%
        if (e.timeStamp - lastTap < 320 && Math.abs(c.clientX - lastTapX) < 40 && c.target === lbImg) {
          zoomTo(sc > 1.01 ? 1 : 2.5, c.clientX, c.clientY, true);
          lastTap = 0;
        } else { lastTap = e.timeStamp; lastTapX = c.clientX; }
      } else if (swipe && dt < 700 && Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.7) {
        if (dx < 0) show(cur + 1); else show(cur - 1);
      }
    }
    gesture = null; swipe = null; pan = null; lastTouchEnd = e.timeStamp;
  }, { passive: true });

  // ── миша (десктоп) ──
  stage.addEventListener('wheel', function(e){
    if (!isOpen) return;
    e.preventDefault();
    zoomTo(sc * (e.deltaY < 0 ? 1.18 : 1 / 1.18), e.clientX, e.clientY, false);
  }, { passive: false });
  // Після подвійного тапу браузер шле ще й dblclick — його треба пропустити,
  // інакше зум відразу скасовується сам собою.
  lbImg.addEventListener('dblclick', function(e){
    if (e.timeStamp - lastTouchEnd < 800) return;
    zoomTo(sc > 1.01 ? 1 : 2.5, e.clientX, e.clientY, true);
  });
  lbImg.addEventListener('mousedown', function(e){
    if (sc <= 1.01) return;
    e.preventDefault();
    var sx = e.clientX, sy = e.clientY, sox = ox, soy = oy;
    function mv(ev){ ox = sox + (ev.clientX - sx); oy = soy + (ev.clientY - sy); clampPan(); applyTf(false); }
    function up(){ document.removeEventListener('mousemove', mv); document.removeEventListener('mouseup', up); }
    document.addEventListener('mousemove', mv);
    document.addEventListener('mouseup', up);
  });
})();
</script>
</body>
